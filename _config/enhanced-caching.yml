---
Name: calendar-enhanced-caching
After:
  - '#corecache'
---

# Named cache pools for the events JSON feed. Registered through the Injector -
# the framework's canonical pattern (see silverstripe/framework _config/cache.yml).
#
# The previous shape of this file applied config to SilverStripe\Core\Cache\CacheFactory,
# which is an interface and not Configurable, so nothing read it: both calendar
# caches silently collapsed into the namespace-less TEMP_PATH/@/ pool, where a
# clear() wiped every other namespace-less cache on the site (issue #132).
SilverStripe\Core\Injector\Injector:
  # Response payloads: the default factory's fastest available adapter chain.
  Psr\SimpleCache\CacheInterface.calendarJSON:
    factory: SilverStripe\Core\Cache\CacheFactory
    constructor:
      namespace: 'calendarJSON'
      defaultLifetime: 1800

  # Version stamps are pinned to a plain FilesystemAdapter, NOT the default
  # factory: DefaultCacheFactory picks its adapter per SAPI (APCu/PhpFiles on
  # web workers, Filesystem under CLI), and both the APCu layer and PhpFiles'
  # opcache backing are invisible across tiers - a stamp bumped from CLI or a
  # queued job would never reach web workers, so cached feeds would survive
  # their own invalidation. A shared on-disk adapter is read coherently by
  # every tier; the (larger) response payloads stay in the fast default pool
  # above, where entries under an old stamp simply become unreachable.
  Dynamic\Calendar\Cache\StampCacheFactory:
    class: SilverStripe\Core\Cache\FilesystemCacheFactory
    constructor:
      directory: '`TEMP_PATH`'
  Psr\SimpleCache\CacheInterface.calendarJSONVersions:
    factory: Dynamic\Calendar\Cache\StampCacheFactory
    constructor:
      namespace: 'calendarJSONVersions'

# Fields whose change invalidates recurrence-derived data (read by
# EventPage::recursionChanged()).
Dynamic\Calendar\Page\EventPage:
  recursion_changed:
    - 'StartDate'
    - 'StartTime'
    - 'EndDate'
    - 'EndTime'
    - 'Recursion'
    - 'Interval'
    - 'RecursionEndDate'
    - 'AllDay'
