---
Name: carbon-recursion
After:
  - '#calendar-config'
---

# Carbon-based recursion system configuration.
#
# 2.3.0: pruned to the keys code actually reads. The removed keys
# (recursion_system, cache_occurrences, max_occurrences_per_request,
# enable_advanced_patterns, timezone_support, cache_instances,
# use_instance_urls, default_date_range, max_virtual_instances,
# auto_cleanup_days, enable_bulk_operations) were never consumed anywhere
# and made the configuration surface look larger than it is (issue #132/#136).
Dynamic\Calendar\Page\EventPage:
  # Enable recursion functionality (read by EventPage::eventRecurs() and CMS fields)
  recursion: true

# Events per page for the paginated index() list (read when
# index_provides_event_list is enabled)
Dynamic\Calendar\Controller\CalendarController:
  events_per_page: 12
